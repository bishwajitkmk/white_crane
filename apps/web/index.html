  <body>
    <!--
      Boot splash. Inline so it paints from the first response, before any JS, CSS or fonts, while the
      API wakes from a cold start. src/lib/splash.ts fades it out once the first page has its data.
      The crane from the logo draws itself in, feet to beak, then breathes while ripples spread at its feet.
    -->
    <div id="splash" role="status" aria-label="Loading White Crane Training Collective">
      <style>
        #splash {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          overflow: hidden;
          background:
            radial-gradient(50% 45% at 15% 85%, rgb(165 197 214 / 0.35), transparent 70%),
            radial-gradient(45% 40% at 85% 15%, rgb(127 155 106 / 0.14), transparent 70%),
            radial-gradient(40% 40% at 50% 45%, rgb(165 197 214 / 0.28), transparent 70%),
            #fff;
          color: #0f2a3b;
          font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          transition: opacity 0.55s ease, visibility 0.55s;
        }
        #splash.splash-out {
          opacity: 0;
          visibility: hidden;
        }
        #splash svg {
          overflow: visible;
        }
        /* The crane from the logo, standing in still water. */
        .sp-crane {
          position: relative;
          width: 106px;
          height: 180px;
        }
        /* Drawn in from the feet up to the beak, then a slow breath. */
        .sp-bird {
          position: relative;
          display: block;
          width: 100%;
          height: 100%;
          transform-origin: 38% 100%;
          -webkit-mask: linear-gradient(to top, #000 45%, transparent 55%) 0 0 / 100% 220% no-repeat;
          mask: linear-gradient(to top, #000 45%, transparent 55%) 0 0 / 100% 220% no-repeat;
          animation:
            sp-draw 1.8s cubic-bezier(0.45, 0, 0.25, 1) 0.15s forwards,
            sp-breathe 4.8s ease-in-out 2s infinite;
        }
        /* Soft glow behind the red crown. */
        .sp-crown {
          position: absolute;
          left: 69%;
          top: 8%;
          width: 34px;
          height: 34px;
          margin: -17px 0 0 -17px;
          border-radius: 50%;
          background: radial-gradient(circle, rgb(214 72 52 / 0.45), transparent 70%);
          opacity: 0;
          animation: sp-glow 4.8s ease-in-out 2s infinite;
        }
        .sp-pond {
          position: absolute;
          left: 38%;
          bottom: -6px;
          width: 200px;
          height: 30px;
          margin-left: -100px;
        }
        .sp-ripple {
          fill: none;
          stroke: #658fa8;
          transform-box: fill-box;
          transform-origin: center;
          animation: sp-ripple 3.6s cubic-bezier(0.2, 0.6, 0.3, 1) 1.2s infinite;
          opacity: 0;
        }
        .sp-ripple:nth-of-type(2) {
          animation-delay: 2.4s;
        }
        .sp-ripple:nth-of-type(3) {
          animation-delay: 3.6s;
        }
        .sp-name {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          text-align: center;
        }
        .sp-name b {
          font-family: "Barlow Condensed", "IBM Plex Sans", system-ui, sans-serif;
          font-weight: 600;
          font-size: 15px;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          color: #2d6385;
        }
        .sp-note {
          position: relative;
          height: 22px;
          width: min(90vw, 420px);
          font-size: 14px;
          color: #4a5d69;
        }
        .sp-note span {
          position: absolute;
          inset: 0;
          opacity: 0;
          animation: sp-note 0.6s ease forwards;
        }
        /* Only shown when loading is slow, so a warm visit never sees them. */
        .sp-note span:last-child {
          animation-delay: 9s;
        }
        .sp-note span:first-child {
          animation-name: sp-note, sp-note-out;
          animation-duration: 0.6s, 0.4s;
          animation-delay: 2.5s, 8.6s;
          animation-fill-mode: forwards, forwards;
        }
        .sp-waves {
          position: absolute;
          left: 0;
          bottom: 9%;
          width: 200%;
          height: 60px;
          animation: sp-flow 18s linear infinite;
        }
        @keyframes sp-ripple {
          0% {
            transform: scale(0.35);
            opacity: 0.55;
          }
          100% {
            transform: scale(1);
            opacity: 0;
          }
        }
        @keyframes sp-draw {
          to {
            -webkit-mask-position: 0 100%;
            mask-position: 0 100%;
          }
        }
        @keyframes sp-breathe {
          50% {
            transform: scaleY(1.015) rotate(-0.6deg);
          }
        }
        @keyframes sp-glow {
          50% {
            opacity: 1;
          }
        }
        @keyframes sp-flow {
          to {
            transform: translateX(-50%);
          }
        }
        @keyframes sp-note {
          to {
            opacity: 1;
          }
        }
        @keyframes sp-note-out {
          to {
            opacity: 0;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #splash *,
          #splash {
            animation: none !important;
            transition: none;
          }
          .sp-bird {
            -webkit-mask: none;
            mask: none;
          }
          .sp-ripple {
            opacity: 0.25;
          }
          .sp-note span:first-child {
            opacity: 1;
          }
        }
      </style>

          <ellipse class="sp-ripple" cx="100" cy="15" rx="98" ry="13" stroke-width="1.2" />
        </svg>
