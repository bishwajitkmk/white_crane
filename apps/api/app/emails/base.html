<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f0f4f5;font-family:Arial,Helvetica,sans-serif;color:#103147">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #cfdadd;border-radius:8px">
            <tr>
              <td style="padding:28px 32px;font-size:15px;line-height:1.5">
                <p style="margin:0 0 20px;font-weight:bold;font-size:16px">White Crane Training Collective</p>
                {% block body %}{% endblock %}
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#5a6e7a;margin:16px 0 0">
            White Crane Training Collective &middot; <a href="{{ frontend_url }}" style="color:#5a6e7a">{{ frontend_url }}</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
